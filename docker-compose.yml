services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdisc-dashboard:latest
    container_name: cdisc-dashboard
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
