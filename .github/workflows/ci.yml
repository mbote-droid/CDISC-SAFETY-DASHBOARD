name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit safety

      - name: Run lint checks
        run: |
          python -m pylint project_1 tests \
            --disable=missing-module-docstring,missing-function-docstring,too-few-public-methods,too-many-arguments,too-many-locals,too-many-branches,too-many-statements,line-too-long,broad-exception-caught

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run security scan
        run: |
          bandit -r project_1 -x tests -f txt
          safety check --full-report || true
