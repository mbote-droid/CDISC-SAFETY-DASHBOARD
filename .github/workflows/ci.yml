name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check src tests app
          ruff format --check src tests app
      - name: Tests (coverage gate 90%)
        run: python -m pytest -q
      - name: Security scan (bandit)
        run: bandit -q -r src -ll
      - name: CLI smoke test
        run: |
          cdisc-safety demo --out outputs --subjects 60
          test -f outputs/manifest.json
          test -f outputs/adam/adae.xpt

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  docker:
    name: Container build and health check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cdisc-safety-dashboard:ci .
      - name: Start container and wait for health
        run: |
          docker run -d --name app -p 8501:8501 cdisc-safety-dashboard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
